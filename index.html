<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pogemon Spelling Capture</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <header>
            <button id="back-to-menu-btn" class="hidden" title="Back to Main Menu"></button>
            <div class="header-actions">
                <button id="score-btn" title="View Your Scores"></button>
                <button id="collection-btn" title="View Your Pogemon Collection"></button>
            </div>
        </header>

        <div id="difficulty-selection">
            <h2>Choose your level:</h2>
            <div class="difficulty-buttons">
                <button data-level="1st Grade" class="image-button" id="grade-1-btn" title="Grade 1"></button>
                <button data-level="2nd Grade" class="image-button" id="grade-2-btn" title="Grade 2"></button>
                <button data-level="3rd Grade" disabled>Grade 3</button>
                <button data-level="5th Grade" disabled>Grade 5</button>
            </div>
        </div>

        <div id="game-area" class="hidden">
            <div id="game-controls-wrapper">
                <div id="spelling-area">
                    <div class="spelling-input-container">
                        <div id="spelling-display"></div>
                    </div>
                    <div id="hint-display"></div>
                </div>

                <div id="word-controls" style="display: none;">
                    <!-- These will be moved to compact-controls by JavaScript -->
                    <button id="speak-word-btn">
                        <span>🔊</span>
                        <span>Hear Word Again</span>
                    </button>
                    <button id="use-in-sentence-btn">
                        <span>📝</span>
                        <span>Use in Sentence</span>
                    </button>
                    <button id="mic-btn">
                        <span id="mic-icon">🎤</span>
                        <span id="mic-status">Use Mic</span>
                    </button>
                    <button id="next-word-btn" class="hidden">Next Word</button>
                </div>
                
                <p id="game-message"></p>
                <!-- Buttons will be inserted here by createCompactControls() -->
            </div>

            <div id="pogemon-reveal-container">
                <div class="card-container">
                    <div id="pogemon-card" class="card">
                        <div class="card-header">
                            <h2 class="pokemon-name" id="card-pogemon-name"></h2>
                            <div class="stats-container">
                                <p class="pokemon-stats" id="card-pogemon-stats"></p>
                            </div>
                        </div>
                        <div class="card-image-container" id="card-pogemon-image-container">
                            <div class="loader"></div>
                        </div>
                        <div class="card-description">
                            <p class="pokemon-description" id="card-pogemon-description"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="pogemon-gallery" class="hidden">
            <h2>Your Pogemon Collection</h2>
            <div id="gallery-grid">
                <p>Capture your first Pogemon to start your collection!</p>
            </div>
        </div>

        <div id="score-view" class="hidden">
            <h2>Your Scores</h2>
            <div id="score-details">
                <p>Play some rounds to see your word stats!</p>
            </div>
        </div>
    </div>
    <script type="importmap">
    {
      "imports": {
        "canvas-confetti": "https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.module.mjs"
      }
    }
    </script>
    <script src="script.js" type="module"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
