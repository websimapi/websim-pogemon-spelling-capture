<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pogemon Spelling Capture</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <header>
            <button id="back-to-menu-btn" class="hidden" title="Back to Main Menu"></button>
            <div class="header-actions">
                <button id="score-btn" title="View Your Scores"></button>
                <button id="collection-btn" title="View Your Pogemon Collection"></button>
            </div>
        </header>

        <div id="difficulty-selection">
            <h2>Choose your level:</h2>
            <div class="difficulty-buttons">
                <button data-level="1st Grade" class="image-button" id="grade-1-btn" title="Grade 1"></button>
                <button data-level="2nd Grade" class="image-button" id="grade-2-btn" title="Grade 2"></button>
                <button data-level="3rd Grade" disabled>Grade 3</button>
                <button data-level="5th Grade" disabled>Grade 5</button>
            </div>
        </div>

        <div id="game-area" class="hidden">
            <div id="game-controls-wrapper">
                <div id="spelling-area">
                    <div class="spelling-input-container">
                        <div id="spelling-display"></div>
                    </div>
                    <div id="hint-display"></div>
                </div>

                <div id="all-controls">
                    <button id="speak-word-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        <span>Hear Word</span>
                    </button>
                    <button id="use-in-sentence-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                        <span>Sentence</span>
                    </button>
                    <button id="mic-btn">
                        <svg id="mic-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                        <span id="mic-status">Use Mic</span>
                    </button>
                    <button id="next-word-btn" class="hidden">Next Word</button>
                </div>
                
                <p id="game-message"></p>

                <div id="pogemon-reveal-container">
                    <div class="card-container">
                        <div id="pogemon-card" class="card">
                            <div class="card-header">
                                <h2 class="pokemon-name" id="card-pogemon-name"></h2>
                                <div class="stats-container">
                                    <p class="pokemon-stats" id="card-pogemon-stats"></p>
                                </div>
                            </div>
                            <div class="card-image-container" id="card-pogemon-image-container">
                                <div class="loader"></div>
                            </div>
                            <div class="card-description">
                                <p class="pokemon-description" id="card-pogemon-description"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="pogemon-gallery" class="hidden">
            <h2>Your Pogemon Collection</h2>
            <div id="gallery-grid">
                <p>Capture your first Pogemon to start your collection!</p>
            </div>
        </div>

        <div id="score-view" class="hidden">
            <h2>Your Scores</h2>
            <div id="score-details">
                <p>Play some rounds to see your word stats!</p>
            </div>
        </div>
    </div>
    <script type="importmap">
    {
      "imports": {
        "canvas-confetti": "https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.module.mjs"
      }
    }
    </script>
    <script src="script.js" type="module"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
